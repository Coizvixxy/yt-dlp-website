<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>YouTube 下載工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .input-section {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e4e8;
            border-radius: 15px;
            margin-bottom: 15px;
            resize: vertical;
            font-size: 16px;
            min-height: 200px;
        }
        .output-section {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .output-text {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e4e8;
            border-radius: 15px;
            margin-bottom: 15px;
            resize: vertical;
            font-size: 14px;
            font-family: monospace;
            background-color: #f8f9fa;
            min-height: 200px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-convert {
            background: linear-gradient(135deg, #ff0000, #cc0000);
        }
        .btn-copy {
            background: linear-gradient(135deg, #4a90e2, #357abd);
        }
        .btn-clear {
            background: linear-gradient(135deg, #6c757d, #495057);
        }
        .btn-execute {
            background: linear-gradient(135deg, #28a745, #218838);
        }
        .alarm-modal {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 15px 30px;
            border-radius: 25px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }
        .download-status {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f2f5;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            transition: width 0.3s ease;
        }
        .status-text {
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 10px;
        }
        /* .loading-animation {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #ff0000;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        } */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-line {
            display: flex;
            align-items: center;
            padding: 2px 0;
        }
        
        .format-selector {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }
        
        .format-selector label {
            margin: 0 10px;
            cursor: pointer;
        }
        
        .downloads-section {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
            border-left: 5px solid #28a745;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .downloads-section h3 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }
        
        .downloads-section h3::before {
            content: '✅';
            margin-right: 10px;
        }
        
        .downloads-list {
            margin-top: 10px;
        }
        
        .downloads-list a {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: #f0f2f5;
            border-radius: 8px;
            color: #ff0000;
            text-decoration: none;
            transition: background 0.2s;
        }
        
        .downloads-list a:hover {
            background: #e6e6e6;
        }
        
        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
        
        /* 文件管理器樣式 */
        .file-manager-section {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
        }
        
        .files-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .files-table th, .files-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }
        
        .files-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        
        .files-stats {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .btn-small {
            padding: 5px 10px;
            margin-right: 5px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #4a90e2, #357abd);
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .btn-reload {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        
        .loading-text, .empty-list, .error-text {
            padding: 15px;
            text-align: center;
            color: #666;
        }
        
        .error-text {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <textarea id="inputLinks" placeholder="請輸入 YouTube 連結，每行一個..."></textarea>
            
            <div class="format-selector">
                <label>
                    <input type="radio" name="format" value="mp4" checked> MP4 視頻
                </label>
                <label>
                    <input type="radio" name="format" value="mp3"> MP3 音頻
                </label>
            </div>
            
            <div class="button-group">
                <button class="btn-execute" onclick="executeDownload()">開始下載</button>
                <button class="btn-clear" onclick="clearAll()">清空全部</button>
            </div>
        </div>
        
        <div class="download-status" id="downloadStatus">
            <h3>下載進度</h3>
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText"></div>
        </div>
        
        <div class="downloads-section" id="downloadsSection">
            <h3>下載完成的文件</h3>
            <div class="downloads-list" id="downloadsList"></div>
        </div>
        
        <div class="file-manager-section" id="fileManagerSection">
            <h3>文件管理</h3>
            <div class="button-group" style="margin-bottom: 10px;">
                <button class="btn-reload" onclick="loadFileList()">刷新文件列表</button>
                <button class="btn-clear" onclick="deleteOldFiles()">清理舊文件</button>
            </div>
            <div class="file-manager-list" id="fileManagerList">
                <!-- 文件列表將在這裏顯示 -->
            </div>
        </div>
    </div>
    <div id="alarmModal" class="alarm-modal"></div>

    <script>
        async function executeDownload() {
            const input = document.getElementById('inputLinks').value;
            const links = input.split('\n').filter(link => link.trim());
            const format = document.querySelector('input[name="format"]:checked').value;
            
            if (links.length === 0) {
                showAlarm('請輸入至少一個 YouTube 連結');
                return;
            }

            const downloadStatus = document.getElementById('downloadStatus');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const downloadsSection = document.getElementById('downloadsSection');
            const downloadsList = document.getElementById('downloadsList');
            
            downloadStatus.style.display = 'block';
            progressBar.style.width = '0%';
            downloadsSection.style.display = 'none';
            downloadsList.innerHTML = '';
            
            // 添加初始載入動畫
            statusText.innerHTML = `
                <div class="status-line loading">
                    <div class="loading-animation"></div>
                    準備下載中...
                </div>
            `;

            // 記錄開始下載時間（用於調試）
            console.log('開始下載請求:', new Date().toISOString());
            console.log('格式:', format);
            console.log('鏈接數量:', links.length);

            try {
                // 確保使用正確的URL（不包含 http://localhost）
                const response = await fetch('./execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        command: links.join(' '),
                        format: format
                    }),
                });

                console.log('收到響應:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        console.log('數據流已完成');
                        break;
                    }
                    
                    const text = decoder.decode(value, { stream: true });
                    console.log('收到數據塊:', text.length, '字節');
                    
                    buffer += text;
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        
                        try {
                            const data = JSON.parse(line);
                            console.log('解析數據:', data);
                            
                            if (data.progress != null) {
                                const totalProgress = ((data.currentVideo - 1) * 100 + data.progress) / data.totalVideos;
                                progressBar.style.width = `${totalProgress}%`;
                            }
                            
                            if (data.status) {
                                const progressInfo = data.currentVideo && data.totalVideos ? 
                                    `[視頻 ${data.currentVideo}/${data.totalVideos}] ` : '';
                                
                                // 添加新的狀態行，帶有載入動畫
                                const newLine = document.createElement('div');
                                newLine.className = 'status-line';
                                if (data.progress !== 100) {
                                    // const loadingIcon = document.createElement('div');
                                    // loadingIcon.className = 'loading-animation';
                                    // newLine.appendChild(loadingIcon);
                                }
                                newLine.appendChild(document.createTextNode(progressInfo + data.status));
                                
                                // 保持最新的 100 行
                                const lines = statusText.children;
                                if (lines.length > 100) {
                                    statusText.removeChild(lines[0]);
                                }
                                
                                statusText.appendChild(newLine);
                                statusText.scrollTop = statusText.scrollHeight;
                            }
                            
                            // 處理下載完成的文件
                            if (data.downloadedFiles && data.downloadedFiles.length > 0) {
                                console.log('下載完成的文件:', data.downloadedFiles);
                                downloadsSection.style.display = 'block';
                                downloadsList.innerHTML = '';
                                
                                data.downloadedFiles.forEach(file => {
                                    // 服務器已經 URL 編碼了文件名
                                    const cleanFile = file;
                                    const fileName = decodeURIComponent(cleanFile.split('/').pop());
                                    
                                    const link = document.createElement('a');
                                    link.href = cleanFile;
                                    link.setAttribute('download', ''); // 確保觸發下載而不是預覽
                                    
                                    // 根據文件類型設置不同的圖標和樣式
                                    const fileType = fileName.endsWith('.mp3') ? 'MP3 音頻' : 'MP4 視頻';
                                    const fileIcon = fileName.endsWith('.mp3') ? '🎵' : '🎬';
                                    
                                    link.innerHTML = `
                                        <div style="display: flex; align-items: center;">
                                            <span style="font-size: 24px; margin-right: 10px;">${fileIcon}</span>
                                            <div>
                                                <div style="font-weight: bold;">${fileName}</div>
                                                <div style="color: #666; font-size: 12px;">${fileType} - 點擊下載</div>
                                            </div>
                                        </div>
                                    `;
                                    
                                    // 添加直接下載功能
                                    link.addEventListener('click', function(e) {
                                        e.preventDefault();
                                        
                                        // 使用fetch API加上download參數來確保下載
                                        fetch(this.href + '?download=1', {
                                            method: 'GET',
                                            headers: {
                                                'Content-Type': 'application/octet-stream',
                                            }
                                        })
                                        .then(response => response.blob())
                                        .then(blob => {
                                            // 創建一個帶有blob URL的隱藏下載鏈接
                                            const url = window.URL.createObjectURL(blob);
                                            const a = document.createElement('a');
                                            a.style.display = 'none';
                                            a.href = url;
                                            a.download = fileName;
                                            document.body.appendChild(a);
                                            a.click();
                                            window.URL.revokeObjectURL(url);
                                            document.body.removeChild(a);
                                            
                                            // 顯示下載開始消息
                                            showAlarm(`開始下載: ${fileName}`);
                                        })
                                        .catch(error => {
                                            console.error('下載失敗:', error);
                                            showAlarm('下載失敗，請重試');
                                        });
                                    });
                                    
                                    downloadsList.appendChild(link);
                                });
                                
                                // 添加"全部下載"按鈕
                                if (data.downloadedFiles.length > 1) {
                                    const downloadAllBtn = document.createElement('button');
                                    downloadAllBtn.textContent = `下載全部 ${data.downloadedFiles.length} 個文件`;
                                    downloadAllBtn.className = 'btn-execute';
                                    downloadAllBtn.style.width = '100%';
                                    downloadAllBtn.style.marginTop = '15px';
                                    
                                    downloadAllBtn.onclick = function() {
                                        // 依次觸發每個文件的下載
                                        const links = downloadsList.querySelectorAll('a');
                                        links.forEach((link, index) => {
                                            setTimeout(() => {
                                                link.click(); // 現在會觸發我們修改過的下載邏輯
                                            }, index * 800); // 增加間隔時間，避免瀏覽器阻止
                                        });
                                    };
                                    
                                    downloadsList.appendChild(downloadAllBtn);
                                }
                                
                                // 自動滾動到下載區域
                                downloadsSection.scrollIntoView({ behavior: 'smooth' });
                            }
                            
                            if (data.error) {
                                showAlarm('下載過程中發生錯誤');
                                console.error('服務器報告錯誤:', data);
                            }
                        } catch (e) {
                            console.error('Error parsing line:', line, e);
                        }
                    }
                }

                showAlarm('所有視頻下載完成！');
            } catch (error) {
                console.error('Download error:', error);
                showAlarm('下載過程中發生錯誤: ' + error.message);
                const errorLine = document.createElement('div');
                errorLine.className = 'status-line';
                errorLine.style.color = '#ff0000';
                errorLine.textContent = `錯誤: ${error.message}`;
                statusText.appendChild(errorLine);
            }
        }

        function clearAll() {
            document.getElementById('inputLinks').value = '';
            document.getElementById('downloadStatus').style.display = 'none';
            document.getElementById('downloadsSection').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('statusText').innerHTML = '';
            document.getElementById('downloadsList').innerHTML = '';
            showAlarm('已清空所有內容');
        }

        function showAlarm(message, duration = 2000) {
            const alarm = document.getElementById('alarmModal');
            alarm.textContent = message;
            alarm.style.display = 'block';
            
            setTimeout(() => {
                alarm.style.display = 'none';
            }, duration);
        }

        // 修改貼上事件處理
        document.getElementById('inputLinks').addEventListener('paste', (e) => {
            // 阻止默認貼上行爲
            e.preventDefault();
            
            // 獲取剪貼板數據
            const clipboardData = e.clipboardData || window.clipboardData;
            let pastedText = clipboardData.getData('text');
            
            // 處理貼上的文本
            pastedText = pastedText
                // 將所有空白行替換爲單個換行
                .replace(/[\r\n]+/g, '\n')
                // 移除每行開頭和結尾的空白
                .split('\n')
                .map(line => line.trim())
                // 過濾掉空行
                .filter(line => line)
                .join('\n');

            // 獲取當前選中位置
            const textarea = document.getElementById('inputLinks');
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            
            // 組合新的文本內容
            const textBefore = textarea.value.substring(0, startPos);
            const textAfter = textarea.value.substring(endPos);
            
            // 確保貼上的內容前後有換行（如果需要）
            const needNewlineBefore = textBefore && !textBefore.endsWith('\n');
            const needNewlineAfter = textAfter && !textAfter.startsWith('\n');
            
            const newText = textBefore + 
                           (needNewlineBefore ? '\n' : '') + 
                           pastedText + 
                           (needNewlineAfter ? '\n' : '') + 
                           textAfter;
            
            // 更新文本框內容
            textarea.value = newText;
            
            // 設置新的光標位置
            const newCursorPos = startPos + pastedText.length + 
                                (needNewlineBefore ? 1 : 0);
            textarea.setSelectionRange(newCursorPos, newCursorPos);
        });

        // 加載文件列表
        async function loadFileList() {
            const fileManagerSection = document.getElementById('fileManagerSection');
            const fileManagerList = document.getElementById('fileManagerList');
            
            fileManagerSection.style.display = 'block';
            fileManagerList.innerHTML = '<div class="loading-text">加載文件列表中...</div>';
            
            try {
                const response = await fetch('./files');
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const files = await response.json();
                
                if (files.length === 0) {
                    fileManagerList.innerHTML = '<div class="empty-list">沒有找到文件</div>';
                    return;
                }
                
                fileManagerList.innerHTML = '';
                
                // 計算總大小
                const totalSize = files.reduce((sum, file) => sum + file.size, 0);
                const totalSizeMB = (totalSize / (1024 * 1024)).toFixed(2);
                
                // 添加統計信息
                const statsDiv = document.createElement('div');
                statsDiv.className = 'files-stats';
                statsDiv.innerHTML = `文件總數: ${files.length} | 總大小: ${totalSizeMB} MB`;
                fileManagerList.appendChild(statsDiv);
                
                // 創建文件表格
                const table = document.createElement('table');
                table.className = 'files-table';
                
                // 表頭
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>文件名</th>
                        <th>大小</th>
                        <th>修改日期</th>
                        <th>操作</th>
                    </tr>
                `;
                table.appendChild(thead);
                
                // 表體
                const tbody = document.createElement('tbody');
                files.forEach(file => {
                    const tr = document.createElement('tr');
                    
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    const date = new Date(file.mtime).toLocaleString();
                    
                    tr.innerHTML = `
                        <td>${file.name}</td>
                        <td>${sizeMB} MB</td>
                        <td>${date}</td>
                        <td>
                            <button class="btn-small btn-download" data-file="${file.name}">下載</button>
                            <button class="btn-small btn-delete" data-file="${file.name}">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                
                fileManagerList.appendChild(table);
                
                // 添加事件監聽器
                document.querySelectorAll('.btn-download').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const fileName = this.getAttribute('data-file');
                        downloadFile(fileName);
                    });
                });
                
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const fileName = this.getAttribute('data-file');
                        deleteFile(fileName);
                    });
                });
                
            } catch (error) {
                console.error('加載文件列表失敗:', error);
                fileManagerList.innerHTML = `<div class="error-text">加載失敗: ${error.message}</div>`;
            }
        }
        
        // 下載文件
        function downloadFile(fileName) {
            const url = `/downloads/${encodeURIComponent(fileName)}?download=1`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/octet-stream',
                }
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showAlarm(`開始下載: ${fileName}`);
            })
            .catch(error => {
                console.error('下載失敗:', error);
                showAlarm('下載失敗，請重試');
            });
        }
        
        // 刪除文件
        async function deleteFile(fileName) {
            if (!confirm(`確定要刪除 ${fileName} 嗎?`)) {
                return;
            }
            
            try {
                const response = await fetch(`./files/${encodeURIComponent(fileName)}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                showAlarm(`已刪除: ${fileName}`);
                loadFileList(); // 刷新文件列表
            } catch (error) {
                console.error('刪除失敗:', error);
                showAlarm(`刪除失敗: ${error.message}`);
            }
        }
        
        // 清理舊文件
        async function deleteOldFiles() {
            if (!confirm('確定要清理所有舊文件嗎? 這將刪除超過72小時的文件。')) {
                return;
            }
            
            try {
                const response = await fetch('./cleanup', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const result = await response.json();
                showAlarm(`清理完成: 刪除了${result.filesRemoved}個文件，釋放了${result.spaceFreedMB}MB空間`);
                loadFileList(); // 刷新文件列表
            } catch (error) {
                console.error('清理失敗:', error);
                showAlarm(`清理失敗: ${error.message}`);
            }
        }
    </script>
</body>
</html>
